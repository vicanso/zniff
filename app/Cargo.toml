[package]
name = "zniff"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["desktop"]
desktop = [
    "dep:nsh-platform-linux",
    "dep:nsh-platform-macos",
    "dep:nsh-platform-windows",
]

[dependencies]
nsh-core = "0.5.0"
nsh-base = { version = "0.5.0", default-features = false, features = ["editor", "highlight"] }
log = "0.4.35"
bytes = "1.12.1"
http = "1.5.0"
flate2 = "1.1.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
toml = "1.2.0"
anyhow = "1.0.104"
qrcode = { version = "0.14.1", default-features = false }

# The browser build is the same view. It does not link the proxy, TLS, or CA stack.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "http1", "http2"] }
http-body = "1.1.0"
http-body-util = "0.1.5"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.11"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
brotli-decompressor = "5.0"
zstd = { version = "0.14.3", default-features = false }
ring = "0.17.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.5.0", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.5.0", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.5.0", default-features = false, optional = true }
winreg = "0.55.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinInet",
] }

[build-dependencies]
flate2 = "1.1.10"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
brotli = "9.1.1"


[profile.release]
opt-level = "s"
codegen-units = 1
lto = true
strip = true
panic = "abort"

[profile.release.package.zlib-rs]
opt-level = 3

[profile.release.package.ring]
opt-level = 3

[profile.release.package.brotli-decompressor]
opt-level = 3

[profile.release.package.httparse]
opt-level = 3
