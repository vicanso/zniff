[package]
name = "zniff"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.3.0"
nsh-base = "0.3.0"
env_logger = "0.11.11"
log = "0.4.35"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
hyper = { version = "1.12.0", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["tokio", "http1", "http2"] }
http-body = "1.1.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
http = "1.5.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = "0.26.6"
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.11"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
flate2 = "1.1.10"
brotli = "9.1.1"
zstd = "0.14.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
anyhow = "1.0.104"
qrcode = { version = "0.14.1", default-features = false }
ring = "0.17.14"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.3.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.3.0", default-features = false }
winreg = "0.55.0"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinInet",
] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }


[profile.release]
codegen-units = 1
lto = true
strip = true
panic = "abort"
