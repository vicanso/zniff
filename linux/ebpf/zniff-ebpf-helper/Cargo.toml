[package]
name = "zniff-ebpf-helper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
zniff-ebpf-common = { path = "../zniff-ebpf-common" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.105"

[target.'cfg(target_os = "linux")'.dependencies]
zniff-ebpf-common = { path = "../zniff-ebpf-common", features = ["user"] }
aya = { version = "0.16.0", default-features = false }
