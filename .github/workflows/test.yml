name: Test

# rustfmt, clippy with warnings denied, and the test suite. The crate is
# app/. zniff ships on macOS, Windows, and Linux, so each of those builds.

on:
  push:
    # Tag pushes are publish.yml's business. The commit behind a tag was
    # already tested when its branch was pushed.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A push superseded by a newer one on the same ref has nothing left to
# prove. Cancel it instead of queueing behind it.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.1
  NSH_VERSION: v0.7.0

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - name: linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: GTK 4, GStreamer, and LLVM dependencies
        # nsh 0.6's Linux backend links GTK 4, GStreamer, and fontconfig/freetype (plus clang/llvm for eBPF).
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libclang-dev \
            llvm-dev \
            libzstd-dev \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - name: Ensure Clang for ring (Windows ARM64)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $candidates = @("C:\Program Files\LLVM\bin")
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -property installationPath
              if ($vsPath) {
                $candidates += (Join-Path $vsPath "VC\Tools\Llvm\ARM64\bin")
                $candidates += (Join-Path $vsPath "VC\Tools\Llvm\x64\bin")
              }
            }
            $found = $candidates | Where-Object { Test-Path (Join-Path $_ "clang.exe") } | Select-Object -First 1
            if ($found) {
              Add-Content -Path $env:GITHUB_PATH -Value $found
              $env:PATH = "$found;$env:PATH"
            } else {
              winget install --id LLVM.LLVM -e --silent --accept-package-agreements --accept-source-agreements
              $llvmBin = "C:\Program Files\LLVM\bin"
              if (-not (Test-Path (Join-Path $llvmBin "clang.exe"))) {
                choco install llvm -y --no-progress
              }
              Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
              $env:PATH = "$llvmBin;$env:PATH"
            }
          }
          clang --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: dtolnay/rust-toolchain@master
        if: matrix.name == 'linux'
        with:
          toolchain: nightly
          components: rust-src
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Ensure target
        if: matrix.target != ''
        shell: pwsh
        run: |
          rustup target add ${{ matrix.target }}
          Add-Content -Path $env:GITHUB_ENV -Value "CARGO_BUILD_TARGET=${{ matrix.target }}"
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: test-${{ matrix.name }}
      - name: fmt
        run: cargo fmt --manifest-path app/Cargo.toml --check
      - name: lint
        run: cargo clippy --manifest-path app/Cargo.toml --all-targets -- --deny=warnings
      - name: check headless cli
        if: matrix.name == 'linux' || matrix.name == 'macos'
        run: cargo check --manifest-path app/Cargo.toml --no-default-features
      - name: lint wasm32
        if: matrix.name == 'linux'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo clippy --manifest-path app/Cargo.toml --lib --no-default-features --target wasm32-unknown-unknown -- --deny=warnings
      - name: test
        run: cargo test --manifest-path app/Cargo.toml --workspace
      - uses: cargo-bins/cargo-binstall@main
        if: matrix.name == 'linux'
      - name: test linux eBPF workspace & build helper
        if: matrix.name == 'linux'
        run: |
          set -euo pipefail
          cargo fmt --manifest-path linux/ebpf/Cargo.toml --all -- --check
          cargo fmt --manifest-path linux/ebpf/zniff-ebpf-prog/Cargo.toml -- --check
          cargo clippy --manifest-path linux/ebpf/Cargo.toml --workspace --all-targets -- -D warnings
          cargo test --manifest-path linux/ebpf/Cargo.toml --workspace
          cargo binstall --no-confirm bpf-linker || cargo install --locked bpf-linker
          ./scripts/build-linux-ebpf.sh
      - name: nsh check (macOS & Linux)
        if: matrix.name == 'macos' || matrix.name == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            macos) nsh_platform="macos-arm64"; sha_cmd="shasum -a 256 -c" ;;
            linux) nsh_platform="linux-x86_64"; sha_cmd="sha256sum -c" ;;
          esac
          asset="nsh-${nsh_platform}.tar.gz"
          base_url="https://github.com/longbridge/nsh/releases/download/${NSH_VERSION}"
          dl_dir="${RUNNER_TEMP}/nsh-dl"
          rm -rf "$dl_dir" "${RUNNER_TEMP}/nsh"
          mkdir -p "$dl_dir"
          curl -fsSL --retry 3 "${base_url}/${asset}" -o "${dl_dir}/${asset}"
          curl -fsSL --retry 3 "${base_url}/${asset}.sha256" -o "${dl_dir}/${asset}.sha256"
          (cd "$dl_dir" && $sha_cmd "${asset}.sha256")
          tar -xzf "${dl_dir}/${asset}" -C "$RUNNER_TEMP"
          rm -rf "$dl_dir"
          (cd app && "${RUNNER_TEMP}/nsh/bin/nsh" check)
