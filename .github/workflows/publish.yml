name: Publish

# Tagged releases. The version lives in app/Cargo.toml, and the tag must
# match it (v0.1.0 for version 0.1.0). macOS builds signed and notarized
# DMGs wrapping zniff.app with icons/zniff.icns. Windows and Linux archives
# contain the binary.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.1
  APP_NAME: zniff

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so git-cliff can see the previous tag.
          fetch-depth: 0
      - name: tag matches app/Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' app/Cargo.toml | head -1)"
          case "$GITHUB_REF_NAME" in
            "v$ver"*) echo "tag $GITHUB_REF_NAME matches app/Cargo.toml version $ver" ;;
            *) echo "tag $GITHUB_REF_NAME does not match app/Cargo.toml version $ver" >&2; exit 1 ;;
          esac
      - name: install git-cliff
        if: startsWith(github.ref, 'refs/tags/')
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
      - name: create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          git cliff --tag-pattern '^v[0-9]+' --latest --strip header > /tmp/notes.md || true
          if ! grep -q '^- ' /tmp/notes.md; then
            echo "$tag" > /tmp/notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            body="$(gh release view "$tag" --json body -q .body)"
            if [ -z "$body" ]; then
              gh release edit "$tag" --notes-file /tmp/notes.md
            fi
          else
            gh release create "$tag" --draft --title "$tag" --notes-file /tmp/notes.md
          fi

  macos:
    needs: prepare
    name: macos-${{ matrix.dmg_suffix }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            dmg_suffix: aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            dmg_suffix: x86_64
    steps:
      - name: preflight notary credentials
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: |
          xcrun notarytool history --apple-id "$AC_USERNAME" \
            --password "$AC_PASSWORD" --team-id "$AC_TEAM_ID" >/dev/null
          echo "notary credentials OK"
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: macos-build-${{ matrix.target }}
      - name: install tools
        run: |
          brew install create-dmg
      - name: Import Code-Signing Certificates
        env:
          p12_certificate: ${{ secrets.MACOS_CERTIFICATE }}
          p12_password: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$p12_certificate" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$p12_password" -T /usr/bin/codesign
          rm -f "$CERT_PATH"

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
      - name: workspace must be clean before the build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "workspace is dirty" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "clean at $(git rev-parse --short=12 HEAD)"
      - name: release
        run: cargo build --manifest-path app/Cargo.toml --release --target ${{ matrix.target }}
      - name: bundle app
        run: |
          set -euo pipefail
          bin="app/target/${{ matrix.target }}/release/${{ env.APP_NAME }}"
          mkdir -p bundle-stage
          scripts/macos-app.sh "$bin" "bundle-stage/${{ env.APP_NAME }}.app"
      - name: sign app
        env:
          CERT_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
        run: |
          echo "Signing App with identity: $CERT_NAME"
          APP="bundle-stage/${{ env.APP_NAME }}.app"
          for attempt in 1 2 3 4 5; do
            if codesign --force --deep --verbose --options runtime --timestamp \
              --sign "$CERT_NAME" \
              "$APP"; then
              echo "codesign succeeded on attempt $attempt"
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "codesign still failing after $attempt attempts" >&2
              exit 1
            fi
            echo "codesign attempt $attempt failed (timestamp server?); retrying in 15s…"
            sleep 15
          done
          if ! codesign -dvv "$APP" 2>&1 | grep -q "^Timestamp="; then
            echo "no secure timestamp embedded in the signature" >&2
            exit 1
          fi
      - name: create dmg
        run: |
          mkdir -p release
          DMG_NAME="release/${{ env.APP_NAME }}-${{ matrix.dmg_suffix }}.dmg"
          APP_PATH="bundle-stage/${{ env.APP_NAME }}.app"
          create-dmg \
            --volname "${{ env.APP_NAME }} Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "${{ env.APP_NAME }}.app" 200 190 \
            --hide-extension "${{ env.APP_NAME }}.app" \
            --app-drop-link 600 185 \
            "$DMG_NAME" \
            "$APP_PATH"
      - name: notarize dmg
        env:
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: |
          DMG_NAME="release/${{ env.APP_NAME }}-${{ matrix.dmg_suffix }}.dmg"
          echo "Submitting DMG for notarization..."
          xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$AC_USERNAME" \
            --password "$AC_PASSWORD" \
            --team-id "$AC_TEAM_ID" \
            --wait
      - name: wait for propagation
        run: sleep 30
      - name: staple DMG
        run: |
          DMG_NAME="release/${{ env.APP_NAME }}-${{ matrix.dmg_suffix }}.dmg"
          xcrun stapler staple "$DMG_NAME"
      - name: upload asset (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "release/${{ env.APP_NAME }}-${{ matrix.dmg_suffix }}.dmg" --clobber

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: zniff.exe
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: zniff
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: GTK 4
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: release-${{ matrix.os }}-${{ matrix.target }}
      - name: release
        run: cargo build --manifest-path app/Cargo.toml --release --target ${{ matrix.target }}
      - name: check glibc symbol baseline
        if: matrix.name == 'linux-x86_64'
        run: |
          set -euo pipefail
          bin="app/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          max_glibc="$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -n1)"
          echo "Max required GLIBC version: ${max_glibc}"
          max_allowed="2.39"
          if [ "$(printf '%s\n%s\n' "$max_allowed" "$max_glibc" | sort -V | tail -n1)" != "$max_allowed" ]; then
            echo "Binary requires GLIBC_${max_glibc}, which exceeds the allowed baseline GLIBC_${max_allowed}" >&2
            exit 1
          fi
      - name: package
        run: |
          set -euo pipefail
          bin="app/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          stage="${{ env.APP_NAME }}-${{ matrix.name }}"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$bin" "$stage/"
          tar -czf "$stage.tar.gz" "$stage"
          ls -l "$stage.tar.gz"
      - name: upload
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ env.APP_NAME }}-${{ matrix.name }}.tar.gz" --clobber

  checksums:
    needs: [macos, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern '*.dmg' --pattern '*.tar.gz' --dir downloaded
          (cd downloaded && sha256sum -- * | sort -k2 > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
