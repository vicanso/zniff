name: Publish

# Tagged releases. The version lives in app/Cargo.toml (mirrored in
# app/nsh.json), and the tag must match it (v0.1.0 for version 0.1.0).
# Desktop apps are packaged with `nsh package` (`zniff-macos-universal.dmg` +
# `.tar.gz`, `zniff-linux-*.tar.gz`, `zniff-windows-*.zip`); standalone Linux
# headless CLI binaries (`--no-default-features` for `--web`, `--relay`, `--mcp`)
# ship alongside them as `zniff-cli-linux-*`.
# The same tag publishes `vicanso/zniff-web:<version>` and, for a stable
# version, `vicanso/zniff-web:latest` (docker.yml).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.1
  NSH_VERSION: v0.7.0
  APP_NAME: zniff

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so git-cliff can see the previous tag.
          fetch-depth: 0
      - name: tag matches app/Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' app/Cargo.toml | head -1)"
          case "$GITHUB_REF_NAME" in
            "v$ver"*) echo "tag $GITHUB_REF_NAME matches app/Cargo.toml version $ver" ;;
            *) echo "tag $GITHUB_REF_NAME does not match app/Cargo.toml version $ver" >&2; exit 1 ;;
          esac
      - name: install git-cliff
        if: startsWith(github.ref, 'refs/tags/')
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
      - name: create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          git cliff --tag-pattern '^v[0-9]+' --latest --strip header > /tmp/notes.md || true
          if ! grep -q '^- ' /tmp/notes.md; then
            echo "$tag" > /tmp/notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            body="$(gh release view "$tag" --json body -q .body)"
            if [ -z "$body" ]; then
              gh release edit "$tag" --notes-file /tmp/notes.md
            fi
          else
            gh release create "$tag" --draft --title "$tag" --notes-file /tmp/notes.md
          fi

  app-macos:
    needs: prepare
    timeout-minutes: 60
    runs-on: macos-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
    steps:
      - uses: actions/checkout@v4

      - name: Preflight Apple notary credentials
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: ./.github/workflows/sign_and_package_macos.sh --preflight

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app -> target"
          shared-key: publish-app-macos
          cache-on-failure: true

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Install NSH CLI (${{ env.NSH_VERSION }})
        env:
          NSH_PLATFORM: macos-arm64
        run: |
          set -euo pipefail
          asset="nsh-${NSH_PLATFORM}.tar.gz"
          base_url="https://github.com/longbridge/nsh/releases/download/${NSH_VERSION}"
          dl_dir="${RUNNER_TEMP}/nsh-dl"
          rm -rf "$dl_dir" "${RUNNER_TEMP}/nsh"
          mkdir -p "$dl_dir"
          curl -fsSL --retry 3 "${base_url}/${asset}" -o "${dl_dir}/${asset}"
          curl -fsSL --retry 3 "${base_url}/${asset}.sha256" -o "${dl_dir}/${asset}.sha256"
          (cd "$dl_dir" && shasum -a 256 -c "${asset}.sha256")
          tar -xzf "${dl_dir}/${asset}" -C "$RUNNER_TEMP"
          rm -rf "$dl_dir"
          echo "${RUNNER_TEMP}/nsh/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/nsh/bin/nsh" --version

      - name: Workspace must be clean before the build
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "workspace is dirty" >&2
            git status --porcelain >&2
            exit 1
          fi
          echo "clean at $(git rev-parse --short=12 HEAD)"

      - name: Package, sign, and notarize zniff Desktop (macOS universal)
        working-directory: app
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_CERTIFICATE_NAME: ${{ secrets.MACOS_CERTIFICATE_NAME }}
          MACOS_APP_PROVISIONING_PROFILE: ${{ secrets.MACOS_APP_PROVISIONING_PROFILE }}
          MACOS_SYSEXT_PROVISIONING_PROFILE: ${{ secrets.MACOS_SYSEXT_PROVISIONING_PROFILE }}
          AC_USERNAME: ${{ secrets.AC_USERNAME }}
          AC_PASSWORD: ${{ secrets.AC_PASSWORD }}
          AC_TEAM_ID: ${{ secrets.AC_TEAM_ID }}
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/zniff-app-out"
          stage_dir="${RUNNER_TEMP}/zniff-app-stage"
          rm -rf "$out_dir" "$stage_dir"
          mkdir -p "$out_dir" "$stage_dir"

          cargo_ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          app_version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) app_version="$cargo_ver" ;;
          esac

          cargo_home="${CARGO_HOME:-${USERPROFILE:-$HOME}/.cargo}"
          rustup_home="${RUSTUP_HOME:-${USERPROFILE:-$HOME}/.rustup}"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. --remap-path-prefix=${cargo_home}=/cargo --remap-path-prefix=${rustup_home}=/rustup ${RUSTFLAGS:-}"

          nsh package --target macos --arch universal \
            --app-version "$app_version" \
            --build "$GITHUB_RUN_NUMBER" \
            --out "$out_dir"

          APP_PATH="${out_dir}/${APP_NAME}.app" \
          STAGE_DIR="$stage_dir" \
          DMG_NAME="${APP_NAME}-macos-universal.dmg" \
          TAR_NAME="${APP_NAME}-macos-universal.tar.gz" \
          VOL_NAME="${APP_NAME} Installer" \
            ../.github/workflows/sign_and_package_macos.sh --package

      - name: Upload zniff Desktop assets (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "${RUNNER_TEMP}/zniff-app-stage"/* -R "$GITHUB_REPOSITORY" --clobber

      - name: Clean up signing keychain
        if: always()
        run: ./.github/workflows/sign_and_package_macos.sh --cleanup

  app-linux:
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            nsh_platform: linux-x86_64
            runs_on: ubuntu-24.04
          - arch: aarch64
            nsh_platform: linux-arm64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runs_on }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
    steps:
      - uses: actions/checkout@v4

      - name: Install GTK 4, GStreamer, and LLVM dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            libclang-dev \
            llvm-dev \
            libzstd-dev \
            pkg-config \
            libfontconfig-dev \
            libfreetype-dev \
            libgtk-4-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rust-src

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: cargo-bins/cargo-binstall@main

      - name: Install bpf-linker
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo binstall --no-confirm --disable-strategies compile bpf-linker

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app -> target"
          shared-key: publish-app-linux-${{ matrix.platform.arch }}
          cache-on-failure: true

      - name: Install NSH CLI (${{ env.NSH_VERSION }})
        env:
          NSH_PLATFORM: ${{ matrix.platform.nsh_platform }}
        run: |
          set -euo pipefail
          asset="nsh-${NSH_PLATFORM}.tar.gz"
          base_url="https://github.com/longbridge/nsh/releases/download/${NSH_VERSION}"
          dl_dir="${RUNNER_TEMP}/nsh-dl"
          rm -rf "$dl_dir" "${RUNNER_TEMP}/nsh"
          mkdir -p "$dl_dir"
          curl -fsSL --retry 3 "${base_url}/${asset}" -o "${dl_dir}/${asset}"
          curl -fsSL --retry 3 "${base_url}/${asset}.sha256" -o "${dl_dir}/${asset}.sha256"
          (cd "$dl_dir" && sha256sum -c "${asset}.sha256")
          tar -xzf "${dl_dir}/${asset}" -C "$RUNNER_TEMP"
          rm -rf "$dl_dir"
          echo "${RUNNER_TEMP}/nsh/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/nsh/bin/nsh" --version

      - name: Package zniff Desktop (Linux ${{ matrix.platform.arch }})
        working-directory: app
        env:
          TARGET_ARCH: ${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          out_dir="${RUNNER_TEMP}/zniff-app-out"
          stage_dir="${RUNNER_TEMP}/zniff-app-stage"
          rm -rf "$out_dir" "$stage_dir"
          mkdir -p "$out_dir" "$stage_dir"

          cargo_ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          app_version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) app_version="$cargo_ver" ;;
          esac

          cargo_home="${CARGO_HOME:-${USERPROFILE:-$HOME}/.cargo}"
          rustup_home="${RUSTUP_HOME:-${USERPROFILE:-$HOME}/.rustup}"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. --remap-path-prefix=${cargo_home}=/cargo --remap-path-prefix=${rustup_home}=/rustup ${RUSTFLAGS:-}"

          helper_bin="${RUNNER_TEMP}/zniff-ebpf-helper"
          (cd .. && ./scripts/build-linux-ebpf.sh "$helper_bin")
          helper_glibc="$(objdump -T "$helper_bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -n1 || true)"
          if [ -n "$helper_glibc" ] && [ "$(printf '%s\n%s\n' "2.39" "$helper_glibc" | sort -V | tail -n1)" != "2.39" ]; then
            echo "Helper binary requires GLIBC_${helper_glibc}, which exceeds baseline GLIBC_2.39" >&2
            exit 1
          fi

          nsh package --target linux \
            --app-version "$app_version" \
            --build "$GITHUB_RUN_NUMBER" \
            --out "$out_dir"

          bin="${out_dir}/${APP_NAME}/${APP_NAME}"
          if [ ! -f "$bin" ]; then
            bin="$(find "$out_dir" -maxdepth 3 -type f -name "$APP_NAME" | head -n 1)"
          fi
          max_glibc="$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -n1)"
          echo "Max required GLIBC version: ${max_glibc}"
          max_allowed="2.39"
          if [ "$(printf '%s\n%s\n' "$max_allowed" "$max_glibc" | sort -V | tail -n1)" != "$max_allowed" ]; then
            echo "Binary requires GLIBC_${max_glibc}, which exceeds the allowed baseline GLIBC_${max_allowed}" >&2
            exit 1
          fi

          bundle_dir="$(dirname "$bin")"
          cp "$helper_bin" "${bundle_dir}/zniff-ebpf-helper"
          chmod 755 "${bundle_dir}/zniff-ebpf-helper"
          tar -czf "${stage_dir}/${APP_NAME}-linux-${TARGET_ARCH}.tar.gz" \
            -C "$(dirname "$bundle_dir")" "$(basename "$bundle_dir")"

      - name: Upload zniff Desktop asset (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" "${RUNNER_TEMP}/zniff-app-stage"/* -R "$GITHUB_REPOSITORY" --clobber

  app-windows:
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            nsh_platform: windows-x86_64
            runs_on: windows-latest
          - arch: aarch64
            nsh_platform: windows-arm64
            runs_on: windows-11-arm
    runs-on: ${{ matrix.platform.runs_on }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Clang for ring (Windows ARM64)
        if: matrix.platform.runs_on == 'windows-11-arm'
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            $candidates = @("C:\Program Files\LLVM\bin")
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -property installationPath
              if ($vsPath) {
                $candidates += (Join-Path $vsPath "VC\Tools\Llvm\ARM64\bin")
                $candidates += (Join-Path $vsPath "VC\Tools\Llvm\x64\bin")
              }
            }
            $found = $candidates | Where-Object { Test-Path (Join-Path $_ "clang.exe") } | Select-Object -First 1
            if ($found) {
              Add-Content -Path $env:GITHUB_PATH -Value $found
              $env:PATH = "$found;$env:PATH"
            } else {
              winget install --id LLVM.LLVM -e --silent --accept-package-agreements --accept-source-agreements
              $llvmBin = "C:\Program Files\LLVM\bin"
              if (-not (Test-Path (Join-Path $llvmBin "clang.exe"))) {
                choco install llvm -y --no-progress
              }
              Add-Content -Path $env:GITHUB_PATH -Value $llvmBin
              $env:PATH = "$llvmBin;$env:PATH"
            }
          }
          clang --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "app -> target"
          shared-key: publish-app-windows-${{ matrix.platform.arch }}
          cache-on-failure: true

      - name: Install NSH CLI (${{ env.NSH_VERSION }})
        env:
          NSH_PLATFORM: ${{ matrix.platform.nsh_platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $asset = "nsh-$($env:NSH_PLATFORM).zip"
          $baseUrl = "https://github.com/longbridge/nsh/releases/download/$env:NSH_VERSION"
          $dlDir = Join-Path $env:RUNNER_TEMP 'nsh-dl'
          $nshDir = Join-Path $env:RUNNER_TEMP 'nsh'
          Remove-Item -Recurse -Force $dlDir, $nshDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $dlDir | Out-Null

          $zip = Join-Path $dlDir $asset
          $shaFile = "$zip.sha256"
          Invoke-WebRequest -UseBasicParsing -Uri "$baseUrl/$asset" -OutFile $zip
          Invoke-WebRequest -UseBasicParsing -Uri "$baseUrl/$asset.sha256" -OutFile $shaFile

          $expected = ((Get-Content $shaFile -Raw).Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "SHA256 mismatch for ${asset}: expected $expected, got $actual"
          }

          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          Remove-Item -Recurse -Force $dlDir
          $binDir = Join-Path $nshDir 'bin'
          $nshExe = Join-Path $binDir 'nsh.exe'
          if (-not (Test-Path $nshExe)) {
            throw "Missing $nshExe after extracting $asset"
          }
          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $nshExe --version
          if ($LASTEXITCODE -ne 0) {
            throw "nsh.exe --version failed with exit code $LASTEXITCODE"
          }

      - name: Package zniff Desktop (Windows ${{ matrix.platform.arch }})
        working-directory: app
        env:
          TARGET_ARCH: ${{ matrix.platform.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $outDir = Join-Path $env:RUNNER_TEMP 'zniff-app-out'
          $stageDir = Join-Path $env:RUNNER_TEMP 'zniff-app-stage'
          Remove-Item -Recurse -Force $outDir, $stageDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outDir, $stageDir | Out-Null

          $cargoVer = (Select-String -Path 'Cargo.toml' -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $appVersion = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME -replace '^v', '' } else { $cargoVer }

          & nsh.exe package --target windows `
            --app-version $appVersion `
            --build $env:GITHUB_RUN_NUMBER `
            --out $outDir
          if ($LASTEXITCODE -ne 0) {
            throw "nsh package --target windows failed with exit code $LASTEXITCODE"
          }

          $zip = Get-ChildItem -Path $outDir -File -Filter '*.zip' | Select-Object -First 1
          if (-not $zip) {
            Get-ChildItem -Path $outDir | Format-Table Name, Length
            throw 'Expected a .zip package from nsh package --target windows'
          }
          Copy-Item $zip.FullName (Join-Path $stageDir "$($env:APP_NAME)-windows-$($env:TARGET_ARCH).zip")

          $setup = Get-ChildItem -Path $outDir -File -Filter '*-setup.exe' | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName (Join-Path $stageDir "$($env:APP_NAME)-windows-$($env:TARGET_ARCH)-setup.exe")
          }

      - name: Upload zniff Desktop artifact (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $stageDir = Join-Path $env:RUNNER_TEMP 'zniff-app-stage'
          $files = Get-ChildItem -Path $stageDir -File | ForEach-Object { $_.FullName }
          & gh release upload $env:GITHUB_REF_NAME @files -R $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "gh release upload failed with exit code $LASTEXITCODE"
          }

  cli-linux:
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: x86_64
            runs_on: ubuntu-24.04
          - arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          shared-key: publish-cli-linux-${{ matrix.platform.arch }}
          cache-on-failure: true
      - name: Build headless CLI binary (Linux ${{ matrix.platform.arch }})
        run: |
          set -euo pipefail
          cargo_home="${CARGO_HOME:-${USERPROFILE:-$HOME}/.cargo}"
          rustup_home="${RUSTUP_HOME:-${USERPROFILE:-$HOME}/.rustup}"
          export RUSTFLAGS="--remap-path-prefix=${GITHUB_WORKSPACE}=. --remap-path-prefix=${cargo_home}=/cargo --remap-path-prefix=${rustup_home}=/rustup ${RUSTFLAGS:-}"
          cargo build --manifest-path app/Cargo.toml --release --locked --no-default-features
          bin="app/target/release/zniff"
          max_glibc="$(objdump -T "$bin" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -uV | tail -n1)"
          echo "Max required GLIBC version: ${max_glibc}"
          max_allowed="2.39"
          if [ "$(printf '%s\n%s\n' "$max_allowed" "$max_glibc" | sort -V | tail -n1)" != "$max_allowed" ]; then
            echo "Binary requires GLIBC_${max_glibc}, which exceeds the allowed baseline GLIBC_${max_allowed}" >&2
            exit 1
          fi
          mkdir -p dist
          cp "$bin" "dist/zniff-cli-linux-${{ matrix.platform.arch }}"
          chmod 755 "dist/zniff-cli-linux-${{ matrix.platform.arch }}"
      - name: Upload CLI binary (tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --clobber

  docker:
    needs: prepare
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/docker.yml
    with:
      channel: ${{ github.ref_name }}
    secrets: inherit

  checksums:
    needs: [app-macos, app-linux, app-windows, cli-linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: SHA256SUMS and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf downloaded
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --dir downloaded
          rm -f downloaded/SHA256SUMS
          (cd downloaded && sha256sum -- * | sort -k2 > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
