name: Publish

# Tagged releases. The version lives in app/Cargo.toml, and the tag must
# match it (v0.1.0 for version 0.1.0). macOS archives contain zniff.app
# with icons/zniff.icns. Windows and Linux archives contain the binary.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.1
  APP_NAME: zniff

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so git-cliff can see the previous tag.
          fetch-depth: 0
      - name: tag matches app/Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' app/Cargo.toml | head -1)"
          case "$GITHUB_REF_NAME" in
            "v$ver"*) echo "tag $GITHUB_REF_NAME matches app/Cargo.toml version $ver" ;;
            *) echo "tag $GITHUB_REF_NAME does not match app/Cargo.toml version $ver" >&2; exit 1 ;;
          esac
      - name: install git-cliff
        if: startsWith(github.ref, 'refs/tags/')
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.13.1
      - name: create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          git cliff --latest --strip header > /tmp/notes.md || true
          if ! grep -q '^- ' /tmp/notes.md; then
            echo "$tag" > /tmp/notes.md
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            body="$(gh release view "$tag" --json body -q .body)"
            if [ -z "$body" ]; then
              gh release edit "$tag" --notes-file /tmp/notes.md
            fi
          else
            gh release create "$tag" --draft --title "$tag" --notes-file /tmp/notes.md
          fi

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: zniff
            bundle: app
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            bin: zniff
            bundle: app
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: zniff.exe
            bundle: bin
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: zniff
            bundle: bin
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: GTK 4
        if: matrix.name == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: release-${{ matrix.target }}
      - name: release
        run: cargo build --manifest-path app/Cargo.toml --release --target ${{ matrix.target }}
      - name: package
        run: |
          set -euo pipefail
          bin="app/target/${{ matrix.target }}/release/${{ matrix.bin }}"
          stage="${{ env.APP_NAME }}-${{ matrix.name }}"
          rm -rf "$stage"
          mkdir -p "$stage"
          if [ "${{ matrix.bundle }}" = "app" ]; then
            scripts/macos-app.sh "$bin" "$stage/zniff.app"
          else
            cp "$bin" "$stage/"
          fi
          tar -czf "$stage.tar.gz" "$stage"
          ls -l "$stage.tar.gz"
      - name: upload
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "${{ env.APP_NAME }}-${{ matrix.name }}.tar.gz" --clobber

  checksums:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern '*.tar.gz' --dir downloaded
          (cd downloaded && sha256sum -- * | sort -k2 > ../SHA256SUMS)
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
